name: Build APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Build Core Release APK
      run: ./gradlew assembleCoreRelease

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Majic-Dialer-core-release
        path: app/build/outputs/apk/core/release/*.apk
